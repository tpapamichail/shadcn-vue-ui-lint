name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # A Windows failure should not cancel the Linux results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        # One Windows run, on the current LTS, for path handling.
        include:
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test
      # Ratchet against the shadcn registry at the commit pinned in
      # packages/evals/scripts/registry.json (fetched sparsely; no local
      # checkout assumed). Counts may only go down.
      - run: pnpm run corpus:check
