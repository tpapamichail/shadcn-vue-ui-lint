name: Release

# Changesets flow: pushes to main with pending changesets open (or update) a
# "Version Packages" PR; merging that PR publishes
# `@tpapamichail/shadcn-vue-lint` to npm with provenance. Publishing runs
# the full gate set first via `pnpm run release`, and authenticates via OIDC
# trusted publishing (id-token: write) — no npm token exists anywhere. The
# `@tpapamichail/shadcn-vue-lint` package on npmjs.com must list this repo
# and workflow as a trusted publisher. While the package is marked
# `private`, changesets skip it and nothing is published.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # version PR, tags, GitHub releases
  pull-requests: write # version PR
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # no `cache: pnpm` here on purpose: the Actions cache is writable
          # from lower-privileged workflow runs, and this job publishes with
          # provenance — install from the registry, verified by the lockfile
          node-version: 24
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm >= 11.5.1 — pinned to the 11 line
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: create version PR or publish
        uses: changesets/action@v2
        with:
          publish-script: pnpm run release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # pnpm publish does not auto-enable provenance under trusted
          # publishing the way npm does; ask for it explicitly
          NPM_CONFIG_PROVENANCE: "true"
